# render.yaml — Render.com Blueprint for site-admin
#
# Live Node server (built-in node:http + node:sqlite) that serves the Vite
# `dist/` build, the JSON API and the admin panel — all from one process.
#
# HOW TO USE
#   Render Dashboard → New → Blueprint → pick the GitHub repo `auryxn/site-admin`
#   → Render reads this file → set the secret env vars (ADMIN_PASSWORD,
#   SESSION_SECRET) → Deploy. The service lands at https://<name>.onrender.com
#   and the admin panel is at /admin (login: ADMIN_USER / ADMIN_PASSWORD).
#
# FREE-TIER NOTE
#   Persistent disks are a PAID Render feature. This blueprint therefore does
#   NOT attach a disk by default: on the free tier the SQLite file lives in
#   /tmp and is re-created + re-seeded on every cold start, so the public site
#   ALWAYS shows content. Admin edits are lost on restart/sleep (fine for a demo).
#   To make content persistent, upgrade to a paid plan, uncomment the `disk:`
#   block below and uncomment DB_PATH / UPLOADS_DIR in `envVars`.

services:
  - type: web
    name: site-admin
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # node:sqlite is available WITHOUT an experimental flag from Node 22.13.0.
      # Anything 22.5–22.12 would crash — keep this pinned to 24.x (active LTS).
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false # secret — set in the Render dashboard
      - key: SESSION_SECRET
        generateValue: true # random 256-bit secret, generated by Render
      # --- Persistence (requires a PAID plan) -----------------------------
      # Uncomment these two AND the `disk:` block to persist the SQLite DB and
      # uploaded images across restarts / deploys.
      # - key: DB_PATH
      #   value: /data/site.sqlite
      # - key: UPLOADS_DIR
      #   value: /data/uploads
    # disk:
    #   name: site-data
    #   mountPath: /data
    #   sizeGB: 1
